{% extends "base.html" %}
{% block title %}Alterar senha{% endblock %}
{% block content %}
<div class="page-header"><h1>Alterar minha senha</h1></div>
<div class="card"><div class="card-body" style="max-width:520px">
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "components/form_fields.html" %}
    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit">Salvar</button>
      <a class="btn btn-outline-secondary" href="{% url 'core:home' %}">Cancelar</a>
    </div>
  </form>
</div></div>
{% endblock %}
